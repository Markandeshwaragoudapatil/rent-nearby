name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rentnearby
          POSTGRES_PASSWORD: rentnearby_test
          POSTGRES_DB: rentnearby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentnearby -d rentnearby_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://rentnearby:rentnearby_test@localhost:5432/rentnearby_test
      SECRET_KEY: ci-only-not-a-production-secret
      FLASK_ENV: development
      SESSION_COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:5173
      RATELIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: flask --app run.py db upgrade
      - name: Verify booking exclusion constraint exists
        run: |
          python -c "import os, psycopg; c=psycopg.connect(os.environ['DATABASE_URL']); r=c.execute(\"SELECT 1 FROM pg_constraint WHERE conname='ex_bookings_no_overlapping_reservations'\").fetchone(); assert r, 'booking exclusion constraint missing'; print('Booking exclusion constraint is installed')"
      - name: Run backend tests
        run: pytest -q
